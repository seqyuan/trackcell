name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Validate pyproject
        run: poetry check

      - name: Install package + dev dependencies
        run: poetry install --with dev --extras clustering --no-interaction

      - name: Lint (flake8, exactly the CONTRIBUTING command)
        run: |
          poetry run flake8 trackcell tests scripts --count --statistics

      - name: Type check (scoped strict modules)
        run: |
          poetry run mypy trackcell/_logging.py trackcell/io/serialize.py

      - name: Format check (black)
        run: poetry run black --check trackcell tests scripts


      - name: Build and validate wheel metadata
        # No --expect-version: the tag check belongs to the release workflow
        # (auto-release.yml). Here we only verify the wheel is self-consistent.
        run: |
          rm -rf dist
          poetry build
          python scripts/check_package.py

      - name: Fast tests + IO coverage ratchet
        run: |
          poetry run coverage run -m pytest -m "not slow" -q
          poetry run coverage report --include="trackcell/io/read_data.py" --fail-under=75
          poetry run coverage report --include="trackcell/io/read_sto.py" --fail-under=60
          # convert_annohdcell has three public functions, a README tutorial and
          # 12% coverage. Ratchet at the current floor so it can only improve;
          # raise the number as tests are added.
          poetry run coverage report --include="trackcell/io/convert_annohdcell.py" --fail-under=12
          poetry run coverage report --include="trackcell/io/serialize.py" --fail-under=70

  integration:
    name: Integration extras (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install integration dependencies
        run: poetry install --with dev --extras "clustering integration" --no-interaction

      - name: Integration tests
        run: poetry run pytest tests/test_integration_sct_rpca.py tests/test_integrate_data.py -q
