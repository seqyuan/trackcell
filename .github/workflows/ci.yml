name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry download cache
        # The virtualenv itself is deliberately NOT cached any more. This repo has
        # no ``poetry.lock``, so the dependency set is resolved fresh on every run;
        # a restored ``.venv`` can therefore hold packages the current resolution
        # no longer includes, and ``poetry install`` does not remove them. That is
        # how a job goes green against a dependency set nobody chose — the 0.4.3
        # investigation found CI testing igraph 0.11 while the maintainer ran
        # 1.0.0, with the stale venv invisible in the log.
        #
        # Poetry's artifact cache is content-addressed, so caching it only makes
        # downloads faster and can never change what gets installed. The cost is a
        # slower install step; the benefit is that a green job means the resolved
        # environment actually works.
        #
        # ``poetry.lock`` is in the key so that adding one later is picked up
        # without editing this file again (hashFiles ignores missing paths).
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: deps-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Validate pyproject
        run: poetry check

      - name: Install package + dev dependencies
        run: poetry install --with dev --extras clustering --no-interaction

      - name: Lint (flake8, exactly the CONTRIBUTING command)
        run: |
          poetry run flake8 trackcell tests scripts --count --statistics

      - name: Type check (scoped strict modules)
        run: |
          poetry run mypy trackcell/_logging.py trackcell/io/serialize.py

      - name: Format check (black)
        run: poetry run black --check trackcell tests scripts


      - name: Import-time budget
        # The package resolves its public names lazily (PEP 562). Without a check
        # here, one top-level ``import scanpy`` anywhere in the tree silently
        # restores the 2.4 s cold start — and, worse, re-imports
        # matplotlib.pyplot, which locks the backend before the caller can call
        # matplotlib.use("Agg").
        run: |
          poetry run python scripts/measure_import.py --check

      - name: Build and validate wheel metadata
        # No --expect-version: the tag check belongs to the release workflow
        # (auto-release.yml). Here we only verify the wheel is self-consistent.
        run: |
          rm -rf dist
          poetry build
          python scripts/check_package.py

      - name: Fast tests + IO coverage ratchet
        run: |
          poetry run coverage run -m pytest -m "not slow" -q
          poetry run coverage report --include="trackcell/io/read_data.py" --fail-under=75
          poetry run coverage report --include="trackcell/io/read_sto.py" --fail-under=60
          # convert_annohdcell has three public functions and a README tutorial.
          # The serial/parallel tests added in 0.6.1 took it from 12% to 50%;
          # ratchet below that so it can only improve.
          poetry run coverage report --include="trackcell/io/convert_annohdcell.py" --fail-under=45
          poetry run coverage report --include="trackcell/io/serialize.py" --fail-under=70

  integration:
    name: Integration extras (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install integration dependencies
        run: poetry install --with dev --extras "clustering integration" --no-interaction

      - name: Integration tests
        run: poetry run pytest tests/test_integration_sct_rpca.py tests/test_integrate_data.py -q
